<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낮 플레이어 채팅</title>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-cyan-dark: #00b8cc;
            --neon-pink: #ff2d95;
            --neon-yellow: #ffdd00;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Glow */
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            overflow: hidden;
        }

        body {
            display: flex;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           Chat Container
           ============================================ */
        .chat-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(18, 18, 26, 0.98) 0%, rgba(10, 10, 15, 0.98) 100%);
            border-top: 1px solid var(--border-default);
            position: relative;
        }

        /* ============================================
           Header
           ============================================ */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--neon-yellow);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .chat-title::before {
            content: '☀️';
        }

        .time-display {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .time-display.urgent {
            color: var(--neon-pink);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* ============================================
           Messages Area
           ============================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            min-height: 0;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
        }

        /* ============================================
           Messages
           ============================================ */
        .message {
            max-width: 85%;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            animation: fadeIn 0.2s ease-out;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.my-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-cyan-dark));
            color: var(--bg-base);
            border-bottom-right-radius: var(--radius-xs);
        }

        .message.other-message {
            align-self: flex-start;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: var(--radius-xs);
        }

        .sender-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--neon-yellow);
            margin-bottom: 2px;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            margin-top: 2px;
        }

        .my-message .message-time {
            color: rgba(0, 0, 0, 0.5);
        }

        .system-message {
            align-self: center;
            max-width: 90%;
            padding: var(--space-xs) var(--space-md);
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-full);
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ============================================
           Input Area
           ============================================ */
        .chat-input-container {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md);
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            position: relative;
            flex-shrink: 0;
        }

        .cooldown-indicator {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-base);
            border: 1px solid var(--neon-pink);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--neon-pink);
            opacity: 0;
            transition: opacity var(--transition-fast);
            pointer-events: none;
        }

        .cooldown-indicator.visible {
            opacity: 1;
        }

        .chat-input {
            flex: 1;
            height: 40px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 0 var(--space-md);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .chat-input:focus {
            border-color: var(--neon-cyan);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-button {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-cyan-dark));
            border: none;
            border-radius: var(--radius-md);
            color: var(--bg-base);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: var(--glow-cyan);
        }

        .send-button:disabled {
            background: var(--bg-elevated);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-button svg {
            width: 18px;
            height: 18px;
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile .chat-input-container {
            padding-bottom: calc(var(--space-md) + var(--sab));
        }

        body.mobile .chat-input {
            font-size: 16px; /* Prevent zoom on iOS */
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">낮의 대화</div>
            <div class="time-display" id="timeDisplay">남은 시간: --:--</div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <div class="cooldown-indicator" id="cooldownIndicator">쿨다운: <span id="cooldownTime">2</span>초</div>
            <input type="text" class="chat-input" id="chatInput" placeholder="메시지 입력..." maxlength="200">
            <button class="send-button" id="sendButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const timeDisplay = document.getElementById('timeDisplay');
        const cooldownIndicator = document.getElementById('cooldownIndicator');
        const cooldownTimeSpan = document.getElementById('cooldownTime');

        // State
        let myPlayerId = '';
        let myPlayerName = '';
        let isCooldown = false;
        let players = [];
        let timeRemaining = 0;
        let isMobile = false;
        let isTablet = false;
        let timerInterval = null;

        function initializeChat(data) {
            isMobile = data.isMobile || false;
            isTablet = data.isTablet || false;
            players = data.players || [];
            myPlayerId = data.myPlayerId || '';
            myPlayerName = data.myPlayerName || '';
            timeRemaining = data.timeLimit || 0;

            updateTimer();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            addSystemMessage('채팅이 시작되었습니다. 마피아를 찾기 위해 토론하세요.');
            revealWidget();
        }

        function updateTimer() {
            if (timeRemaining <= 0) {
                timeDisplay.textContent = '시간 종료';
                timeDisplay.classList.add('urgent');
                return;
            }

            timeRemaining -= 1;
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;

            timeDisplay.textContent = `남은 시간: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeRemaining <= 30) {
                timeDisplay.classList.add('urgent');
            } else {
                timeDisplay.classList.remove('urgent');
            }
        }

        function sendMessage() {
            if (isCooldown) {
                showCooldown();
                return;
            }

            const message = chatInput.value.trim();
            if (!message) return;

            window.parent.postMessage({
                type: 'chatMessage',
                message: message
            }, '*');

            chatInput.value = '';
            startCooldown(1);
        }

        function startCooldown(seconds) {
            isCooldown = true;
            sendButton.disabled = true;
            showCooldown(seconds);

            let remaining = seconds;
            const timer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(timer);
                    isCooldown = false;
                    sendButton.disabled = false;
                    hideCooldown();
                } else {
                    showCooldown(remaining);
                }
            }, 1000);
        }

        function showCooldown(time) {
            cooldownTimeSpan.textContent = time || '2';
            cooldownIndicator.classList.add('visible');
        }

        function hideCooldown() {
            cooldownIndicator.classList.remove('visible');
        }

        function addMessage(data) {
            const { senderId, senderName, message, timestamp, isMine } = data;

            const messageEl = document.createElement('div');
            messageEl.className = isMine ? 'message my-message' : 'message other-message';

            const messageTime = new Date(timestamp);
            const timeStr = `${messageTime.getHours().toString().padStart(2, '0')}:${messageTime.getMinutes().toString().padStart(2, '0')}`;

            let html = '';
            if (!isMine) {
                html += `<div class="sender-name">${senderName}</div>`;
            }
            html += `<div class="message-content">${escapeHtml(message)}</div>`;
            html += `<div class="message-time">${timeStr}</div>`;

            messageEl.innerHTML = html;
            chatMessages.appendChild(messageEl);
            scrollToBottom();
        }

        function addSystemMessage(message) {
            const systemEl = document.createElement('div');
            systemEl.className = 'system-message';
            systemEl.textContent = message;
            chatMessages.appendChild(systemEl);
            scrollToBottom();
        }

        function displayChatHistory(messages) {
            messages.forEach(msg => {
                addMessage({
                    senderId: msg.sender,
                    senderName: msg.senderName,
                    message: msg.message,
                    timestamp: msg.timestamp,
                    isMine: msg.sender === myPlayerId
                });
            });
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function hideWidget() {
            window.parent.postMessage({ type: 'WidgetRearrange', anchor: 'bottom', width: '0', height: '0' }, '*');
        }

        function revealWidget() {
            if (isMobile && !isTablet) {
                window.parent.postMessage({ type: 'WidgetRearrange', anchor: 'bottom', width: '100%', height: '35%' }, '*');
            } else {
                window.parent.postMessage({ type: 'WidgetRearrange', anchor: 'bottom', width: '40%', height: '35%' }, '*');
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.parent.focus();
            }
        });

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'init':
                    initializeChat(data);
                    break;
                case 'hideWidget':
                    hideWidget();
                    break;
                case 'showWidget':
                    revealWidget();
                    break;
                case 'newMessage':
                    addMessage(data);
                    break;
                case 'cooldown':
                    startCooldown(data.remainingTime || 2);
                    break;
                case 'cooldownEnd':
                    isCooldown = false;
                    sendButton.disabled = false;
                    hideCooldown();
                    break;
                case 'chatHistory':
                    displayChatHistory(data.messages || []);
                    break;
                case 'focusInput':
                    chatInput.focus();
                    break;
            }
        });

        window.addEventListener('unload', () => {
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
</body>
</html>
