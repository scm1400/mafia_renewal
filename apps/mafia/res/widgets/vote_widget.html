<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-cyan-dark: #00b8cc;
            --neon-pink: #ff2d95;
            --neon-pink-dark: #cc0055;
            --neon-purple: #b026ff;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;
            --bg-overlay: rgba(10, 10, 15, 0.92);

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Semantic */
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);
            --border-cyan: rgba(0, 240, 255, 0.3);

            /* Glow */
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 45, 149, 0.5);

            /* Shadow */
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           Vote Container
           ============================================ */
        .vote-container {
            width: 420px;
            max-width: calc(100% - 32px);
            max-height: 90vh;
            background: var(--bg-surface);
            border: 1px solid var(--border-cyan);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--glow-cyan);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: scaleIn 0.3s ease-out;
            position: relative;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            width: 32px;
            height: 32px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            z-index: 10;
        }

        .close-btn:hover {
            background: var(--bg-surface);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* ============================================
           Header
           ============================================ */
        .vote-header {
            padding: var(--space-xl);
            padding-right: 50px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .vote-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            margin-bottom: var(--space-xs);
        }

        .vote-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ============================================
           Timer
           ============================================ */
        .timer-section {
            padding: var(--space-md) var(--space-xl);
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .timer {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .timer.urgent {
            color: var(--neon-pink);
            animation: urgentPulse 1s ease-in-out infinite;
        }

        @keyframes urgentPulse {
            0%, 100% {
                color: var(--neon-pink);
                text-shadow: 0 0 20px rgba(255, 45, 149, 0.5);
            }
            50% {
                color: #ff6b9d;
                text-shadow: 0 0 35px rgba(255, 45, 149, 0.8);
            }
        }

        /* ============================================
           Players List
           ============================================ */
        .players-section {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md);
            min-height: 0;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .player-item:hover:not(.disabled):not(.is-self) {
            background: rgba(0, 240, 255, 0.05);
            border-color: var(--border-cyan);
        }

        .player-item.selected {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
        }

        .player-item.is-self {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .player-item.vote-blocked {
            opacity: 0.7;
            background: rgba(255, 51, 102, 0.1);
            border-color: rgba(255, 51, 102, 0.3);
            cursor: not-allowed;
        }

        .player-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            background: var(--bg-base);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .player-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .blocked-tag {
            font-size: 10px;
            font-weight: 500;
            padding: 2px 6px;
            background: rgba(255, 51, 102, 0.2);
            color: var(--danger);
            border-radius: var(--radius-sm);
        }

        .vote-count {
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            min-width: 24px;
            text-align: right;
        }

        /* ============================================
           Vote Button
           ============================================ */
        .vote-action {
            padding: var(--space-lg);
            border-top: 1px solid var(--border-subtle);
        }

        .vote-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-cyan-dark));
            border: none;
            border-radius: var(--radius-md);
            color: var(--bg-base);
            font-family: var(--font-family);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--glow-cyan);
        }

        .vote-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .vote-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .vote-btn:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        .vote-btn.voted {
            background: linear-gradient(135deg, var(--success), #00cc6a);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .vote-btn.blocked {
            background: linear-gradient(135deg, var(--danger), #cc0033);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        /* ============================================
           Vote Results
           ============================================ */
        .vote-results {
            padding: var(--space-lg);
            border-top: 1px solid var(--border-subtle);
            display: none;
        }

        .vote-results.visible {
            display: block;
        }

        .results-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--neon-pink);
            text-align: center;
            margin-bottom: var(--space-md);
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
        }

        .result-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .result-votes {
            font-weight: 700;
            color: var(--neon-cyan);
        }

        /* ============================================
           Seduce Result (Madam ability)
           ============================================ */
        .seduce-result {
            padding: var(--space-lg);
            background: var(--bg-elevated);
            border-radius: var(--radius-md);
            text-align: center;
        }

        .seduce-result strong {
            color: var(--neon-pink);
        }

        .seduce-mafia {
            color: var(--neon-pink);
            margin-top: var(--space-md);
        }

        /* ============================================
           Scrollbar
           ============================================ */
        .players-section::-webkit-scrollbar {
            width: 6px;
        }

        .players-section::-webkit-scrollbar-track {
            background: var(--bg-base);
            border-radius: var(--radius-full);
        }

        .players-section::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
        }

        .players-section::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.3);
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile .vote-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            max-height: 100%;
            border-radius: 0;
            border: none;
        }

        body.mobile .vote-header {
            padding: var(--space-lg);
            padding-top: calc(var(--space-lg) + var(--sat));
        }

        body.mobile .close-btn {
            top: calc(var(--space-md) + var(--sat));
        }

        body.mobile .vote-action {
            padding-bottom: calc(var(--space-lg) + var(--sab));
        }

        body.mobile .player-item {
            padding: var(--space-sm) var(--space-md);
        }

        body.mobile .player-avatar {
            width: 34px;
            height: 34px;
            font-size: 16px;
        }

        body.mobile .player-name {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="vote-container">
        <button class="close-btn" id="closeBtn">×</button>

        <div class="vote-header">
            <div class="vote-title" id="voteTitle">투표</div>
            <div class="vote-subtitle" id="voteSubtitle">마피아로 의심되는 사람에게 투표하세요</div>
        </div>

        <div class="timer-section">
            <div class="timer" id="timer">남은 시간: 30초</div>
        </div>

        <div class="players-section">
            <div class="players-list" id="playersList"></div>
        </div>

        <div class="vote-action">
            <button class="vote-btn" id="voteBtn" disabled>투표하기</button>
        </div>

        <div class="vote-results" id="voteResults">
            <div class="results-title">투표 결과</div>
            <div class="results-list" id="resultsList"></div>
        </div>
    </div>

    <script>
        // State
        let players = [];
        let selectedPlayerId = null;
        let voteResults = {};
        let myPlayerId = null;
        let isVotePhase = true;
        let hasVoted = false;
        let remainingTime = 30;
        let timerInterval = null;
        let blockedVoters = [];
        let voteButtonListener = null;

        let _isMobile = false;
        let _isTablet = false;

        // DOM Elements
        const closeBtn = document.getElementById('closeBtn');
        const voteTitle = document.getElementById('voteTitle');
        const voteSubtitle = document.getElementById('voteSubtitle');
        const timerEl = document.getElementById('timer');
        const playersList = document.getElementById('playersList');
        const voteBtn = document.getElementById('voteBtn');
        const voteResultsEl = document.getElementById('voteResults');
        const resultsList = document.getElementById('resultsList');

        // Event Listeners
        closeBtn.addEventListener('click', closeWidget);

        function closeWidget() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            if (voteButtonListener) {
                voteBtn.removeEventListener('click', voteButtonListener);
                voteButtonListener = null;
            }
        }

        function renderPlayers() {
            playersList.innerHTML = '';

            players.forEach(player => {
                if (!player.isAlive) return;

                const item = document.createElement('div');
                item.className = 'player-item';
                item.dataset.id = player.id;

                const isSelf = player.id === myPlayerId;
                const isBlocked = blockedVoters.includes(player.id);
                const isSelected = selectedPlayerId === player.id;

                if (isSelf) item.classList.add('is-self');
                if (isBlocked) item.classList.add('vote-blocked');
                if (isSelected) item.classList.add('selected');

                if (!isSelf && !hasVoted && isVotePhase && !blockedVoters.includes(myPlayerId)) {
                    item.addEventListener('click', () => selectPlayer(player.id));
                } else if (!isSelf) {
                    item.classList.add('disabled');
                }

                let statusText = isSelf ? '(나)' : '';
                if (isBlocked && isSelf) {
                    statusText = '(나) - 건달에 의해 투표 차단됨';
                }

                const voteCount = voteResults[player.id] || '';

                item.innerHTML = `
                    <div class="player-avatar">${player.emoji || '👤'}</div>
                    <div class="player-info">
                        <div class="player-name">
                            ${player.name}
                            ${isBlocked ? '<span class="blocked-tag">투표 차단</span>' : ''}
                        </div>
                        <div class="player-status">${statusText}</div>
                    </div>
                    <div class="vote-count">${voteCount}</div>
                `;

                playersList.appendChild(item);
            });

            updateVoteButton();
        }

        function updateVoteButton() {
            const isBlocked = blockedVoters.includes(myPlayerId);

            voteBtn.disabled = !selectedPlayerId || hasVoted || !isVotePhase || selectedPlayerId === myPlayerId || isBlocked;

            if (isBlocked) {
                voteBtn.textContent = '투표 차단됨 (건달 능력)';
                voteBtn.classList.add('blocked');
                voteBtn.classList.remove('voted');
            } else if (hasVoted) {
                voteBtn.textContent = '투표 완료';
                voteBtn.classList.add('voted');
                voteBtn.classList.remove('blocked');
            } else {
                voteBtn.textContent = '투표하기';
                voteBtn.classList.remove('voted', 'blocked');
            }
        }

        function selectPlayer(playerId) {
            if (hasVoted || !isVotePhase || playerId === myPlayerId || blockedVoters.includes(myPlayerId)) return;

            selectedPlayerId = playerId;
            renderPlayers();
        }

        function submitVote() {
            if (!selectedPlayerId || hasVoted || !isVotePhase) return;

            if (blockedVoters.includes(myPlayerId)) {
                alert('건달에 의해 투표가 차단되었습니다.');
                return;
            }

            hasVoted = true;
            updateVoteButton();

            window.parent.postMessage({
                type: "vote",
                targetId: selectedPlayerId
            }, "*");
        }

        function showVoteResults(results) {
            isVotePhase = false;
            voteResults = results;

            voteResultsEl.classList.add('visible');
            resultsList.innerHTML = '';

            const sortedResults = Object.entries(results).sort((a, b) => b[1] - a[1]);

            sortedResults.forEach(([playerId, votes]) => {
                const player = players.find(p => p.id === playerId);
                if (!player) return;

                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div class="result-name">${player.name}</div>
                    <div class="result-votes">${votes}표</div>
                `;
                resultsList.appendChild(item);
            });

            voteBtn.disabled = true;
            voteTitle.textContent = '투표 결과';
            voteSubtitle.textContent = '가장 많은 표를 받은 플레이어가 처형됩니다';

            clearInterval(timerInterval);
            timerEl.style.display = 'none';
        }

        function updateTimer() {
            remainingTime--;
            timerEl.textContent = `남은 시간: ${remainingTime}초`;

            if (remainingTime <= 10) {
                timerEl.classList.add('urgent');
            }

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                if (!hasVoted && selectedPlayerId) {
                    submitVote();
                }
            }
        }

        function startTimer(seconds) {
            remainingTime = seconds;
            timerEl.textContent = `남은 시간: ${remainingTime}초`;
            timerEl.classList.remove('urgent');

            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function hideWidget() {
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "middle",
                    width: "100%",
                    height: "100%",
                }, "*");
            }
        }

        function showSeduceResult(targetName, targetJob, isMafia, enableMafiaChat) {
            voteResultsEl.classList.add('visible');
            resultsList.style.display = 'none';

            const seduceDiv = document.createElement('div');
            seduceDiv.className = 'seduce-result';

            let html = `<strong>${targetName}</strong>님을 유혹했습니다!<br>`;
            html += `대상의 직업은 <strong>${targetJob}</strong>입니다.<br>`;
            html += '다음 밤에 대상은 능력을 사용할 수 없게 됩니다.';

            if (isMafia) {
                html += '<div class="seduce-mafia">마피아와 접선에 성공했습니다!<br>다음 밤에 마피아와 대화할 수 있습니다.</div>';
            }

            seduceDiv.innerHTML = html;
            voteResultsEl.appendChild(seduceDiv);

            voteTitle.textContent = '유혹 결과';
            voteSubtitle.textContent = '투표 종료까지 기다려주세요';
        }

        // Message Handler
        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;
                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                document.body.classList.remove("hidden");
                revealWidget();

                if (timerInterval) {
                    clearInterval(timerInterval);
                }

                players = data.players;
                myPlayerId = data.myPlayerId;
                isVotePhase = true;
                hasVoted = false;
                selectedPlayerId = null;
                voteResults = {};
                blockedVoters = data.blockedVoters || [];

                // Reset UI
                voteResultsEl.classList.remove('visible');
                resultsList.innerHTML = '';
                timerEl.style.display = 'block';
                timerEl.classList.remove('urgent');

                renderPlayers();

                if (data.timeLimit) {
                    startTimer(data.timeLimit);
                }

                if (voteButtonListener) {
                    voteBtn.removeEventListener('click', voteButtonListener);
                }
                voteButtonListener = submitVote;
                voteBtn.addEventListener('click', voteButtonListener);
            } else if (data.type === 'voteConfirmed') {
                if (!voteResults[data.targetId]) {
                    voteResults[data.targetId] = 1;
                } else {
                    voteResults[data.targetId]++;
                }
                renderPlayers();
            } else if (data.type === 'voteRejected') {
                hasVoted = false;
                updateVoteButton();
                alert(data.message || '투표에 실패했습니다.');
            } else if (data.type === 'updateVotes') {
                voteResults = data.votes;
                renderPlayers();
            } else if (data.type === 'showResults') {
                showVoteResults(data.results);
            } else if (data.type === 'seduceResult') {
                showSeduceResult(data.targetName, data.targetJob, data.isMafia, data.enableMafiaChat);
            } else if (data.type === 'voteBlocked') {
                alert(data.message || '건달에 의해 투표가 차단되었습니다.');
            } else if (data.type === "hide" || data.type === 'hideWidget') {
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                hideWidget();
            } else if (data.type === "reveal" || data.type === 'showWidget') {
                revealWidget();
            }
        });

        window.addEventListener('unload', function() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            if (voteButtonListener && voteBtn) {
                voteBtn.removeEventListener('click', voteButtonListener);
            }
            window.parent.focus();
        });

        function checkMobile() {
            if (window.innerWidth <= 768) {
                document.body.classList.add('mobile');
            } else {
                document.body.classList.remove('mobile');
            }
        }

        window.addEventListener('resize', checkMobile);
        checkMobile();
