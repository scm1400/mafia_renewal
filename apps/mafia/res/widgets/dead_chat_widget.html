<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>죽은 플레이어 채팅</title>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-purple: #b026ff;
            --neon-purple-dark: #8b1acc;
            --ghost-gray: #8a8a9a;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Glow */
            --glow-purple: 0 0 20px rgba(176, 38, 255, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            overflow: hidden;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body.hidden {
            display: none;
        }

        /* ============================================
           Chat Container
           ============================================ */
        .chat-container {
            width: 320px;
            max-width: 100%;
            height: 400px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(18, 18, 26, 0.98) 0%, rgba(10, 10, 15, 0.98) 100%);
            border: 1px solid rgba(176, 38, 255, 0.3);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), var(--glow-purple);
            overflow: hidden;
        }

        /* ============================================
           Header
           ============================================ */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            background: rgba(176, 38, 255, 0.1);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ghost-gray);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .minimize-btn {
            width: 28px;
            height: 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .minimize-btn:hover {
            background: var(--bg-surface);
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        /* ============================================
           Messages Area
           ============================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            min-height: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
        }

        /* ============================================
           Messages
           ============================================ */
        .chat-message {
            max-width: 85%;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            animation: fadeIn 0.2s ease-out;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.my-message {
            align-self: flex-end;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
        }

        .chat-message.other-message {
            align-self: flex-start;
            background: rgba(176, 38, 255, 0.1);
            border: 1px solid rgba(176, 38, 255, 0.2);
        }

        .chat-message.system-message {
            align-self: center;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-full);
            padding: var(--space-xs) var(--space-md);
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
        }

        .chat-message.medium-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-left: 3px solid #00ff88;
        }

        .sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--ghost-gray);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .role-indicator {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: var(--radius-sm);
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .content {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-secondary);
        }

        .timestamp {
            font-size: 10px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 2px;
        }

        /* ============================================
           Input Area
           ============================================ */
        .chat-input-container {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-md);
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            height: 40px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 0 var(--space-md);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .chat-input:focus {
            border-color: var(--neon-purple);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-send-button {
            height: 40px;
            padding: 0 var(--space-lg);
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-purple-dark));
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .chat-send-button:hover:not(:disabled) {
            box-shadow: var(--glow-purple);
        }

        .chat-send-button:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* ============================================
           Spectator Mode
           ============================================ */
        .spectator-mode {
            display: none;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm) var(--space-md);
            background: rgba(0, 255, 136, 0.1);
            border-top: 1px solid rgba(0, 255, 136, 0.2);
            font-size: 12px;
            color: #00ff88;
            flex-shrink: 0;
        }

        .spectator-mode.visible {
            display: flex;
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile .chat-container {
            width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
            border-top: 1px solid rgba(176, 38, 255, 0.3);
        }

        body.mobile .chat-input {
            font-size: 16px;
        }

        body.mobile .chat-input-container {
            padding-bottom: calc(var(--space-md) + var(--sab));
        }
    </style>
</head>
<body class="hidden">
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">☠️ 죽은 자들의 대화</div>
            <button class="minimize-btn" id="minimizeBtn">−</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="메시지 입력...">
            <button class="chat-send-button" id="sendButton">전송</button>
        </div>

        <div class="spectator-mode" id="spectatorContainer">
            <span id="spectatorText">영매는 메시지를 볼 수만 있습니다</span>
        </div>
    </div>

    <script>
        // State
        let isMinimized = false;
        let myPlayerId = null;
        let myName = null;
        let myRole = null;
        let _isMobile = false;
        let _isTablet = false;
        let isSpectatorMode = false;
        let isNightPhase = false;

        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const spectatorContainer = document.getElementById('spectatorContainer');
        const spectatorText = document.getElementById('spectatorText');

        minimizeBtn.addEventListener('click', minimizeWidget);
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function minimizeWidget() {
            isMinimized = !isMinimized;
            if (isMinimized) {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    width: "200px",
                    height: "40px",
                    anchor: "bottomRight",
                }, "*");
                document.querySelector('.chat-container').style.display = 'none';
            } else {
                revealWidget();
            }
        }

        function hideWidget() {
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            document.querySelector('.chat-container').style.display = 'flex';

            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'bottomRight',
                    height: '400px',
                    width: '100%',
                }, '*');
            } else {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "bottomRight",
                    width: "320px",
                    height: "400px",
                }, "*");
            }
        }

        function addChatMessage(sender, content, isMyMessage = false, isSystem = false, senderRole = null) {
            const messageDiv = document.createElement('div');

            if (isSystem) {
                messageDiv.className = 'chat-message system-message';
                messageDiv.innerHTML = `<div class="content">${escapeHtml(content)}</div>`;
            } else {
                let messageClass = `chat-message ${isMyMessage ? 'my-message' : 'other-message'}`;
                if (senderRole === 'medium') {
                    messageClass += ' medium-message';
                }
                messageDiv.className = messageClass;

                let html = '';
                if (!isMyMessage) {
                    html += `<div class="sender">${escapeHtml(sender)}`;
                    if (senderRole === 'medium') {
                        html += `<span class="role-indicator">영매</span>`;
                    }
                    html += `</div>`;
                }
                html += `<div class="content">${escapeHtml(content)}</div>`;

                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                html += `<div class="timestamp">${hours}:${minutes}</div>`;

                messageDiv.innerHTML = html;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            if (isSpectatorMode && (!isNightPhase && myRole === 'medium')) return;

            const message = chatInput.value.trim();
            if (!message) return;

            window.parent.postMessage({
                type: "deadChatMessage",
                message: message
            }, "*");

            addChatMessage('나', message, true, false, myRole);
            chatInput.value = '';
        }

        function setSpectatorMode(enable) {
            isSpectatorMode = enable;

            if (enable) {
                updateMediumChatAccess();
                spectatorContainer.classList.add('visible');
            } else {
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.placeholder = "메시지 입력...";
                spectatorContainer.classList.remove('visible');
            }
        }

        function updateMediumChatAccess() {
            if (myRole !== 'medium') return;

            if (isNightPhase) {
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.placeholder = "메시지 입력...";
                spectatorText.textContent = "밤 시간에는 메시지를 보낼 수 있습니다";
            } else {
                chatInput.disabled = true;
                sendButton.disabled = true;
                chatInput.placeholder = "밤에만 메시지를 보낼 수 있습니다...";
                spectatorText.textContent = "밤 시간에만 메시지를 보낼 수 있습니다";
            }
        }

        function checkMobile() {
            if (_isMobile || _isTablet || window.innerWidth <= 768) {
                document.body.classList.add('mobile');
            } else {
                document.body.classList.remove('mobile');
            }
        }

        // Message Handler
        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;

                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                myPlayerId = data.myPlayerId;
                myName = data.myName;
                myRole = data.myRole;
                isNightPhase = data.isNight || false;

                document.body.classList.remove("hidden");
                revealWidget();

                if (myRole === 'medium') {
                    setSpectatorMode(true);
                } else {
                    setSpectatorMode(false);
                }

                if (myRole === 'medium') {
                    addChatMessage(null, "영매로서 죽은 자들의 대화를 볼 수 있습니다. 밤에만 메시지를 보낼 수 있습니다.", false, true);
                } else {
                    addChatMessage(null, "죽은 자들과의 대화가 시작되었습니다.", false, true);
                }

                if (data.messages && Array.isArray(data.messages)) {
                    data.messages.forEach(msg => {
                        const isMyMessage = msg.senderId === myPlayerId;
                        addChatMessage(isMyMessage ? '나' : msg.senderName, msg.message, isMyMessage, false, msg.senderRole);
                    });
                }

                checkMobile();
            } else if (data.type === "chatMessage") {
                if (data.senderId !== myPlayerId) {
                    addChatMessage(data.senderName, data.message, false, false, data.senderRole);
                }
            } else if (data.type === "systemMessage") {
                addChatMessage(null, data.message, false, true);
            } else if (data.type === "phaseChange") {
                isNightPhase = data.isNight;
                if (myRole === 'medium') {
                    updateMediumChatAccess();
                    if (isNightPhase) {
                        addChatMessage(null, "밤이 되었습니다. 메시지를 보낼 수 있습니다.", false, true);
                    } else {
                        addChatMessage(null, "낮이 되었습니다. 메시지를 보낼 수 없습니다.", false, true);
                    }
                }
            } else if (data.type === "hide" || data.type === "hideWidget") {
                hideWidget();
            } else if (data.type === "reveal" || data.type === "showWidget") {
                revealWidget();
            } else if (data.type === "focusInput") {
                chatInput.focus();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.parent.focus();
            }
        });

        window.addEventListener('resize', checkMobile);
        checkMobile();
    </script>
</body>
</html>
