<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b026ff;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;
            --bg-overlay: rgba(10, 10, 15, 0.95);

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Glow */
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-cyan-strong: 0 0 40px rgba(0, 240, 255, 0.7);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;
            --space-2xl: 32px;

            /* Radius */
            --radius-md: 10px;
            --radius-lg: 14px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-overlay);
            backdrop-filter: blur(4px);
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           Content Box
           ============================================ */
        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-2xl);
            padding: var(--space-xl);
            max-width: 800px;
            text-align: center;
        }

        /* Message with typewriter effect */
        #message {
            font-size: 48px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
            line-height: 1.3;
            min-height: 60px;
            display: inline-block;
        }

        #message::after {
            content: '|';
            animation: blink 0.7s step-end infinite;
            color: var(--neon-cyan);
        }

        #message.typing-done::after {
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Start Button */
        .start-button {
            padding: var(--space-md) var(--space-2xl);
            background: linear-gradient(135deg, var(--neon-cyan), #00b8cc);
            color: var(--bg-base);
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--glow-cyan);
            animation: buttonPulse 2s ease-in-out infinite;
        }

        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-cyan-strong);
        }

        .start-button:active {
            transform: scale(0.98);
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
            50% { box-shadow: 0 0 35px rgba(0, 240, 255, 0.6); }
        }

        /* Hidden state */
        .hidden {
            position: absolute !important;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile .content-box {
            padding: var(--space-lg);
            padding-top: calc(var(--space-lg) + var(--sat));
            padding-bottom: calc(var(--space-lg) + var(--sab));
        }

        body.mobile #message {
            font-size: 28px;
        }

        body.mobile .start-button {
            font-size: 16px;
            padding: var(--space-md) var(--space-xl);
        }

        /* ============================================
           Decorative Elements
           ============================================ */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            animation: scanlineMove 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scanlineMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="hidden">
    <div class="scanline"></div>
    <div class="content-box">
        <div id="message"></div>
        <button id="startButton" class="start-button">게임 시작</button>
    </div>

    <script>
        let _isMobile = false;
        let _isTablet = false;
        let typingIndex = 0;
        let typingTimeout = null;

        const messageElement = document.getElementById("message");
        const startButton = document.getElementById("startButton");

        const isLocal = window.location.protocol === 'file:';
        if (isLocal) {
            document.body.classList.remove("hidden");
        }

        function typeText(text) {
            if (typingIndex < text.length) {
                if (text[typingIndex] === "\n") {
                    messageElement.innerHTML += "<br>";
                } else {
                    messageElement.innerHTML += text[typingIndex];
                }
                typingIndex++;
                typingTimeout = setTimeout(() => {
                    typeText(text);
                }, 100);
            } else {
                messageElement.classList.add('typing-done');
                setTimeout(() => {
                    hideWidget();
                }, 1500);
            }
        }

        function hideWidget() {
            if (typingTimeout) {
                clearTimeout(typingTimeout);
            }
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "middle",
                    width: "100%",
                    height: "100%",
                }, "*");
            }
        }

        window.addEventListener("message", function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;
                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === "init") {
                window.focus();
                typingIndex = 0;
                messageElement.innerHTML = '';
                messageElement.classList.remove('typing-done');

                _isMobile = data.isMobile;
                _isTablet = data.isTablet;

                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                }

                document.body.classList.remove("hidden");
                revealWidget();

                if (data.message) {
                    typeText(data.message);
                }
            } else if (data.type === "hide" || data.type === "hideWidget") {
                hideWidget();
            } else if (data.type === "reveal" || data.type === "showWidget") {
                revealWidget();
            }
        });

        window.addEventListener('unload', function() {
            window.parent.focus();
        });

        startButton.addEventListener('click', function() {
            window.parent.postMessage({
                type: 'startGame'
            }, "*");
        });
    </script>
</body>
</html>
