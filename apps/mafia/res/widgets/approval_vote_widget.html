<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-cyan-dark: #00b8cc;
            --neon-pink: #ff2d95;
            --neon-pink-dark: #cc0055;
            --neon-purple: #b026ff;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;
            --bg-overlay: rgba(10, 10, 15, 0.92);

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Semantic */
            --success: #00ff88;
            --success-dark: #00cc6a;
            --danger: #ff3366;
            --danger-dark: #cc0033;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);
            --border-cyan: rgba(0, 240, 255, 0.3);

            /* Glow */
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 45, 149, 0.5);
            --glow-success: 0 0 20px rgba(0, 255, 136, 0.5);
            --glow-danger: 0 0 20px rgba(255, 51, 102, 0.5);

            /* Shadow */
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================
           Container
           ============================================ */
        .approval-container {
            width: 480px;
            max-width: calc(100% - 32px);
            background: var(--bg-surface);
            border: 1px solid var(--neon-pink);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--glow-pink);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: scaleIn 0.3s ease-out;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================
           Header
           ============================================ */
        .header {
            padding: var(--space-xl);
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 45, 149, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-pink);
            text-shadow: var(--glow-pink);
            margin-bottom: var(--space-xs);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ============================================
           Content
           ============================================ */
        .content {
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        /* Player Info */
        .player-info {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            padding: var(--space-lg);
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
        }

        .player-avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .player-details {
            flex: 1;
        }

        .player-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }

        .player-status {
            font-size: 13px;
            color: var(--neon-pink);
        }

        /* Timer */
        .timer-section {
            text-align: center;
        }

        .timer {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .timer.urgent {
            color: var(--neon-pink);
            animation: urgentPulse 1s ease-in-out infinite;
        }

        @keyframes urgentPulse {
            0%, 100% {
                color: var(--neon-pink);
                text-shadow: 0 0 20px rgba(255, 45, 149, 0.5);
            }
            50% {
                color: #ff6b9d;
                text-shadow: 0 0 35px rgba(255, 45, 149, 0.8);
            }
        }

        /* Defense Message */
        .defense-section {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            max-height: 120px;
            overflow-y: auto;
        }

        .defense-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }

        .defense-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* ============================================
           Vote Options
           ============================================ */
        .vote-options {
            display: flex;
            gap: var(--space-md);
        }

        .vote-option {
            flex: 1;
            padding: var(--space-lg);
            background: var(--bg-elevated);
            border: 2px solid var(--border-default);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .vote-option:hover:not(.disabled) {
            transform: translateY(-2px);
        }

        .vote-option.approve {
            border-color: rgba(0, 255, 136, 0.3);
        }

        .vote-option.approve:hover:not(.disabled) {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--success);
        }

        .vote-option.approve.selected {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--success);
            box-shadow: var(--glow-success);
        }

        .vote-option.reject {
            border-color: rgba(255, 51, 102, 0.3);
        }

        .vote-option.reject:hover:not(.disabled) {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--danger);
        }

        .vote-option.reject.selected {
            background: rgba(255, 51, 102, 0.15);
            border-color: var(--danger);
            box-shadow: var(--glow-danger);
        }

        .vote-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .vote-icon {
            font-size: 36px;
            margin-bottom: var(--space-sm);
        }

        .vote-label {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: var(--space-xs);
        }

        .vote-option.approve .vote-label {
            color: var(--success);
        }

        .vote-option.reject .vote-label {
            color: var(--danger);
        }

        .vote-description {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ============================================
           Vote Results
           ============================================ */
        .vote-results {
            display: none;
        }

        .vote-results.visible {
            display: block;
        }

        .result-bar-container {
            height: 32px;
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
            overflow: hidden;
            display: flex;
            margin-bottom: var(--space-md);
        }

        .result-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            transition: width 0.5s ease;
        }

        .result-bar.approve {
            background: linear-gradient(90deg, var(--success), var(--success-dark));
            color: var(--bg-base);
        }

        .result-bar.reject {
            background: linear-gradient(90deg, var(--danger-dark), var(--danger));
            color: var(--text-primary);
        }

        .result-labels {
            display: flex;
            justify-content: space-between;
        }

        .result-label {
            font-size: 14px;
            font-weight: 600;
        }

        .result-label.approve {
            color: var(--success);
        }

        .result-label.reject {
            color: var(--danger);
        }

        /* ============================================
           Footer
           ============================================ */
        .footer {
            display: flex;
            gap: var(--space-md);
            padding: var(--space-lg) var(--space-xl);
            border-top: 1px solid var(--border-subtle);
        }

        .btn {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            background: var(--bg-base);
            border-color: var(--border-cyan);
            color: var(--neon-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-cyan-dark));
            color: var(--bg-base);
            box-shadow: var(--glow-cyan);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        .btn-primary:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ============================================
           Scrollbar
           ============================================ */
        .defense-section::-webkit-scrollbar {
            width: 4px;
        }

        .defense-section::-webkit-scrollbar-track {
            background: var(--bg-base);
            border-radius: var(--radius-full);
        }

        .defense-section::-webkit-scrollbar-thumb {
            background: var(--bg-surface);
            border-radius: var(--radius-full);
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile .approval-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            border-radius: 0;
            border: none;
        }

        body.mobile .header {
            padding-top: calc(var(--space-xl) + var(--sat));
        }

        body.mobile .footer {
            padding-bottom: calc(var(--space-lg) + var(--sab));
        }

        body.mobile .vote-options {
            flex-direction: column;
        }

        body.mobile .player-avatar {
            width: 48px;
            height: 48px;
            font-size: 20px;
        }

        body.mobile .player-name {
            font-size: 16px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="approval-container">
        <div class="header">
            <h1 class="header-title">찬반 투표</h1>
            <p class="header-subtitle">최후 변론을 들은 후, 처형에 대한 찬반 투표를 진행합니다.</p>
        </div>

        <div class="content">
            <div class="player-info">
                <div class="player-avatar" id="playerAvatar">?</div>
                <div class="player-details">
                    <div class="player-name" id="playerName">플레이어 이름</div>
                    <div class="player-status">처형 대상</div>
                </div>
            </div>

            <div class="timer-section">
                <div class="timer" id="timer">00:30</div>
            </div>

            <div class="defense-section">
                <div class="defense-label">최후 변론</div>
                <div class="defense-text" id="defenseMessage">최후 변론 내용이 여기에 표시됩니다.</div>
            </div>

            <div class="vote-options" id="voteOptions">
                <div class="vote-option approve" id="approveOption">
                    <div class="vote-icon">👍</div>
                    <div class="vote-label">찬성</div>
                    <div class="vote-description">처형에 동의합니다</div>
                </div>
                <div class="vote-option reject" id="rejectOption">
                    <div class="vote-icon">👎</div>
                    <div class="vote-label">반대</div>
                    <div class="vote-description">처형에 반대합니다</div>
                </div>
            </div>

            <div class="vote-results" id="voteResults">
                <div class="result-bar-container">
                    <div class="result-bar approve" id="approveBar" style="width: 0%"></div>
                    <div class="result-bar reject" id="rejectBar" style="width: 0%"></div>
                </div>
                <div class="result-labels">
                    <div class="result-label approve">찬성: <span id="approveCount">0</span></div>
                    <div class="result-label reject">반대: <span id="rejectCount">0</span></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="btn btn-secondary" id="closeBtn">닫기</button>
            <button class="btn btn-primary" id="submitVoteBtn">투표 제출</button>
        </div>
    </div>

    <script>
        // State
        let timeLeft = 30;
        let timerInterval = null;
        let selectedVote = null;
        let voteSubmitted = false;
        let defendantId = null;
        let myPlayerId = null;
        let defenseText = "";
        let isAlive = true;
        let isDefendant = false;

        let _isMobile = false;
        let _isTablet = false;

        // Event listener references
        let approveListener = null;
        let rejectListener = null;
        let submitListener = null;
        let closeListener = null;

        // DOM Elements
        const timerEl = document.getElementById('timer');
        const playerNameEl = document.getElementById('playerName');
        const playerAvatarEl = document.getElementById('playerAvatar');
        const defenseMessageEl = document.getElementById('defenseMessage');
        const voteOptionsEl = document.getElementById('voteOptions');
        const approveOptionEl = document.getElementById('approveOption');
        const rejectOptionEl = document.getElementById('rejectOption');
        const voteResultsEl = document.getElementById('voteResults');
        const approveBarEl = document.getElementById('approveBar');
        const rejectBarEl = document.getElementById('rejectBar');
        const approveCountEl = document.getElementById('approveCount');
        const rejectCountEl = document.getElementById('rejectCount');
        const submitVoteBtn = document.getElementById('submitVoteBtn');
        const closeBtn = document.getElementById('closeBtn');

        function setupEventListeners() {
            // Remove existing listeners
            if (approveListener) {
                approveOptionEl.removeEventListener('click', approveListener);
                rejectOptionEl.removeEventListener('click', rejectListener);
                submitVoteBtn.removeEventListener('click', submitListener);
                closeBtn.removeEventListener('click', closeListener);
            }

            // Create new listeners
            approveListener = () => selectVote('approve');
            rejectListener = () => selectVote('reject');
            submitListener = submitVote;
            closeListener = closeWidget;

            approveOptionEl.addEventListener('click', approveListener);
            rejectOptionEl.addEventListener('click', rejectListener);
            submitVoteBtn.addEventListener('click', submitListener);
            closeBtn.addEventListener('click', closeListener);
        }

        function initialize(data) {
            // Clear existing timer
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            // Reset state
            voteSubmitted = false;
            selectedVote = null;

            // Set data
            defendantId = data.defendantId;
            myPlayerId = data.myPlayerId;
            defenseText = data.defenseText || "변론이 제출되지 않았습니다.";
            isAlive = data.isAlive !== false;
            isDefendant = defendantId === myPlayerId;

            // Update UI
            playerNameEl.textContent = data.defendantName;
            playerAvatarEl.textContent = data.defendantName.charAt(0).toUpperCase();
            defenseMessageEl.textContent = defenseText;

            // Timer
            timeLeft = data.timeLimit || 30;
            updateTimerDisplay();
            startTimer();

            // Reset vote options
            voteResultsEl.classList.remove('visible');
            voteOptionsEl.classList.remove('hidden');
            submitVoteBtn.disabled = false;
            approveOptionEl.classList.remove('selected', 'disabled');
            rejectOptionEl.classList.remove('selected', 'disabled');

            // Dead or defendant cannot vote
            if (!isAlive || isDefendant) {
                voteOptionsEl.classList.add('hidden');
                submitVoteBtn.disabled = true;
            }

            revealWidget();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 10) {
                    timerEl.classList.add('urgent');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (isAlive && !voteSubmitted && !isDefendant) {
                        submitVote();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function selectVote(vote) {
            if (voteSubmitted || !isAlive || isDefendant) return;

            selectedVote = vote;

            approveOptionEl.classList.remove('selected');
            rejectOptionEl.classList.remove('selected');

            if (vote === 'approve') {
                approveOptionEl.classList.add('selected');
            } else {
                rejectOptionEl.classList.add('selected');
            }
        }

        function submitVote() {
            if (voteSubmitted || !isAlive || isDefendant) return;

            // Default to reject if no selection
            if (!selectedVote) {
                selectedVote = 'reject';
            }

            voteSubmitted = true;
            submitVoteBtn.disabled = true;
            voteOptionsEl.classList.add('hidden');

            // Disable options
            approveOptionEl.classList.add('disabled');
            rejectOptionEl.classList.add('disabled');

            window.parent.postMessage({
                type: 'submitApprovalVote',
                vote: selectedVote
            }, '*');
        }

        function showResults(results, isFinalResult) {
            const approveCount = results.approve || 0;
            const rejectCount = results.reject || 0;
            const total = approveCount + rejectCount;

            if (total === 0) return;

            const approvePercentage = (approveCount / total) * 100;
            const rejectPercentage = (rejectCount / total) * 100;

            approveBarEl.style.width = `${approvePercentage}%`;
            rejectBarEl.style.width = `${rejectPercentage}%`;
            approveCountEl.textContent = approveCount;
            rejectCountEl.textContent = rejectCount;

            voteResultsEl.classList.add('visible');

            if (isFinalResult || voteSubmitted) {
                voteOptionsEl.classList.add('hidden');
                submitVoteBtn.disabled = true;
            }
        }

        function closeWidget() {
            hideWidget();
        }

        function hideWidget() {
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                const containerHeight = document.querySelector('.approval-container').offsetHeight;
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "middle",
                    width: "100%",
                    height: `${containerHeight + 20}px`,
                }, "*");
            }
        }

        // Message handler
        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;

                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                setupEventListeners();
                initialize(data);
            } else if (data.type === 'showResults') {
                showResults(data.results, data.isFinalResult);
            } else if (data.type === 'hideWidget') {
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                hideWidget();
            } else if (data.type === 'showWidget') {
                revealWidget();
            }
        });

        window.addEventListener('unload', function() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            window.parent.focus();
        });
    </script>
</body>
</html>
