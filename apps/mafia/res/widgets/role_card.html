<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b026ff;

            /* Role Colors */
            --role-mafia: #ff3366;
            --role-police: #00aaff;
            --role-doctor: #00ff88;
            --role-citizen: #ffdd00;
            --role-spy: #b026ff;
            --role-medium: #8b5cf6;
            --role-soldier: #64748b;
            --role-politician: #f59e0b;
            --role-lover: #ec4899;
            --role-journalist: #06b6d4;
            --role-werewolf: #a16207;
            --role-gangster: #475569;
            --role-detective: #0284c7;
            --role-gravedigger: #6b7280;
            --role-terrorist: #dc2626;
            --role-madam: #db2777;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Shadow */
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;

            /* Role-specific (will be overridden by class) */
            --role-color: var(--neon-cyan);
            --role-glow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-lg);
        }

        /* ============================================
           Role Card
           ============================================ */
        .role-card {
            width: 280px;
            max-width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--role-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--role-glow);
            overflow: hidden;
            position: relative;
            animation: cardAppear 0.4s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Animated border effect */
        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--role-color), transparent);
            animation: borderGlow 2s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Close Button */
        .close-button {
            position: absolute;
            top: var(--space-md);
            right: var(--space-md);
            width: 28px;
            height: 28px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            z-index: 10;
        }

        .close-button:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* ============================================
           Header
           ============================================ */
        .role-header {
            padding: var(--space-xl);
            padding-right: 48px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
        }

        .role-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--role-color);
            text-shadow: var(--role-glow);
            margin-bottom: var(--space-md);
        }

        .role-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--role-color), rgba(0, 0, 0, 0.3));
            border: 2px solid var(--role-color);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: var(--role-glow);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ============================================
           Content
           ============================================ */
        .role-description {
            padding: 0 var(--space-lg);
            padding-bottom: var(--space-lg);
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .role-ability {
            background: var(--bg-elevated);
            border-top: 1px solid var(--border-subtle);
            padding: var(--space-lg);
        }

        .ability-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--role-color);
            margin-bottom: var(--space-sm);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .ability-title::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--role-color);
            border-radius: var(--radius-full);
            box-shadow: var(--role-glow);
        }

        .ability-description {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        /* ============================================
           Role-specific Colors
           ============================================ */
        .role-card.mafia { --role-color: var(--role-mafia); --role-glow: 0 0 20px rgba(255, 51, 102, 0.5); }
        .role-card.police { --role-color: var(--role-police); --role-glow: 0 0 20px rgba(0, 170, 255, 0.5); }
        .role-card.doctor { --role-color: var(--role-doctor); --role-glow: 0 0 20px rgba(0, 255, 136, 0.5); }
        .role-card.citizen { --role-color: var(--role-citizen); --role-glow: 0 0 20px rgba(255, 221, 0, 0.5); }
        .role-card.spy { --role-color: var(--role-spy); --role-glow: 0 0 20px rgba(176, 38, 255, 0.5); }
        .role-card.medium { --role-color: var(--role-medium); --role-glow: 0 0 20px rgba(139, 92, 246, 0.5); }
        .role-card.soldier { --role-color: var(--role-soldier); --role-glow: 0 0 20px rgba(100, 116, 139, 0.5); }
        .role-card.politician { --role-color: var(--role-politician); --role-glow: 0 0 20px rgba(245, 158, 11, 0.5); }
        .role-card.lover { --role-color: var(--role-lover); --role-glow: 0 0 20px rgba(236, 72, 153, 0.5); }
        .role-card.journalist { --role-color: var(--role-journalist); --role-glow: 0 0 20px rgba(6, 182, 212, 0.5); }
        .role-card.werewolf { --role-color: var(--role-werewolf); --role-glow: 0 0 20px rgba(161, 98, 7, 0.5); }
        .role-card.gangster { --role-color: var(--role-gangster); --role-glow: 0 0 20px rgba(71, 85, 105, 0.5); }
        .role-card.detective { --role-color: var(--role-detective); --role-glow: 0 0 20px rgba(2, 132, 199, 0.5); }
        .role-card.gravedigger { --role-color: var(--role-gravedigger); --role-glow: 0 0 20px rgba(107, 114, 128, 0.5); }
        .role-card.terrorist { --role-color: var(--role-terrorist); --role-glow: 0 0 20px rgba(220, 38, 38, 0.5); }
        .role-card.madam { --role-color: var(--role-madam); --role-glow: 0 0 20px rgba(219, 39, 119, 0.5); }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile {
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 15, 0.92);
            padding: var(--space-lg);
        }

        body.mobile .role-card {
            width: 320px;
            max-width: calc(100% - 32px);
        }
    </style>
</head>
<body>
    <div class="role-card" id="roleCard">
        <div class="close-button" onclick="closeWidget()">×</div>
        <div class="role-header">
            <div class="role-title" id="role-title">역할 이름</div>
            <div class="role-icon" id="role-icon">🎭</div>
        </div>
        <div class="role-description" id="role-description">
            역할에 대한 설명이 여기에 표시됩니다.
        </div>
        <div class="role-ability">
            <div class="ability-title" id="ability-title">능력</div>
            <div class="ability-description" id="ability-description">
                역할의 능력에 대한 설명이 여기에 표시됩니다.
            </div>
        </div>
    </div>

    <script>
        let roleData = {};
        let _isMobile = false;
        let _isTablet = false;

        function closeWidget() {
            hideWidget();
        }

        function hideWidget() {
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "topleft",
                    width: "320px",
                    height: "420px",
                }, "*");
            }
        }

        function updateRoleUI(roleId) {
            const role = roleId ? roleId.toLowerCase() : '';
            const roleInfo = roleData[role];

            if (roleInfo) {
                document.getElementById('role-title').textContent = roleInfo.title;
                document.getElementById('role-icon').textContent = roleInfo.icon;
                document.getElementById('role-description').textContent = roleInfo.description;
                document.getElementById('ability-title').textContent = roleInfo.abilityTitle;
                document.getElementById('ability-description').textContent = roleInfo.abilityDescription;

                const roleCard = document.getElementById('roleCard');
                roleCard.className = 'role-card';
                roleCard.classList.add(role);
            } else {
                document.getElementById('role-title').textContent = `알 수 없는 역할`;
                document.getElementById('role-icon').textContent = "❓";
                document.getElementById('role-description').textContent = "직업 정보를 찾을 수 없습니다.";
                document.getElementById('ability-title').textContent = "알 수 없는 능력";
                document.getElementById('ability-description').textContent = "능력 정보를 찾을 수 없습니다.";
            }

            revealWidget();
        }

        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;
                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                document.body.classList.remove("hidden");
                revealWidget();
            } else if (data.type === 'initRoleData') {
                if (data.roleData) {
                    roleData = data.roleData;
                }
            } else if (data.type === 'setRole') {
                updateRoleUI(data.role);
            } else if (data.type === 'role_info') {
                const roleId = data.roleId || data.role.toLowerCase();
                const role = roleId.toLowerCase();

                if (!roleData[role]) {
                    roleData[role] = {
                        title: data.role,
                        icon: data.icon || "❓",
                        description: data.description || "설명 없음",
                        abilityTitle: "능력",
                        abilityDescription: data.ability || "능력 설명 없음"
                    };
                }

                document.getElementById('role-title').textContent = data.role;
                document.getElementById('role-icon').textContent = data.icon || "❓";
                document.getElementById('role-description').textContent = data.description || "설명 없음";
                document.getElementById('ability-title').textContent = "능력";
                document.getElementById('ability-description').textContent = data.ability || "능력 설명 없음";

                const roleCard = document.getElementById('roleCard');
                roleCard.className = 'role-card';
                roleCard.classList.add(data.roleId || role);

                revealWidget();
            } else if (data.type === "hide" || data.type === "hideWidget") {
                hideWidget();
            } else if (data.type === "reveal" || data.type === "showWidget") {
                revealWidget();
            }
        });

        window.addEventListener('unload', function() {
            window.parent.focus();
        });

        function checkMobile() {
            if (window.innerWidth <= 768) {
                document.body.classList.add('mobile');
            } else {
                document.body.classList.remove('mobile');
            }
        }

        window.addEventListener('resize', checkMobile);
        checkMobile();
    </script>
</body>
</html>
