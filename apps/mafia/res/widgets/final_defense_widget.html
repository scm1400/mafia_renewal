<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b026ff;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;
            --bg-overlay: rgba(10, 10, 15, 0.92);

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Danger/Warning */
            --danger: #ff3366;
            --danger-glow: 0 0 20px rgba(255, 51, 102, 0.5);
            --warning: #ffaa00;

            /* Shadow */
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            padding: var(--space-lg);
        }

        /* ============================================
           Main Container
           ============================================ */
        .final-defense-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-surface);
            border: 1px solid var(--danger);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--danger-glow);
            overflow: hidden;
            animation: containerAppear 0.4s ease-out;
        }

        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(-10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ============================================
           Header
           ============================================ */
        .header {
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 51, 102, 0.1));
            border-bottom: 1px solid rgba(255, 51, 102, 0.3);
            padding: var(--space-lg) var(--space-xl);
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--danger), transparent);
        }

        .header-icon {
            font-size: 28px;
            margin-bottom: var(--space-sm);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--danger);
            text-shadow: var(--danger-glow);
            margin-bottom: var(--space-xs);
        }

        .header p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ============================================
           Content
           ============================================ */
        .content {
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        /* Player Info */
        .player-info {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--danger), rgba(255, 51, 102, 0.5));
            border: 2px solid var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            box-shadow: var(--danger-glow);
            animation: avatarPulse 2s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 51, 102, 0.7); }
        }

        .player-details {
            flex: 1;
        }

        .player-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }

        .player-status {
            font-size: 12px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .player-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--danger);
            border-radius: var(--radius-full);
            animation: statusBlink 1s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Timer */
        .timer-container {
            text-align: center;
            padding: var(--space-md);
            background: var(--bg-base);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        .timer-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--space-xs);
        }

        .timer {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--danger);
            text-shadow: var(--danger-glow);
            animation: timerPulse 1s ease-in-out infinite;
        }

        .timer.warning {
            color: var(--warning);
            text-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }

        .timer.critical {
            animation: timerCritical 0.5s ease-in-out infinite;
        }

        @keyframes timerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        @keyframes timerCritical {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Defense Area */
        .defense-area {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .defense-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .defense-title::before {
            content: '';
            width: 3px;
            height: 12px;
            background: var(--danger);
            border-radius: 2px;
        }

        .defense-input {
            width: 100%;
            min-height: 120px;
            padding: var(--space-md);
            background: var(--bg-base);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .defense-input::placeholder {
            color: var(--text-muted);
        }

        .defense-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1);
        }

        .defense-message {
            width: 100%;
            min-height: 120px;
            max-height: 200px;
            padding: var(--space-md);
            background: var(--bg-base);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .defense-message.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Views */
        .defendant-view,
        .spectator-view {
            display: none;
        }

        .defendant-view.active,
        .spectator-view.active {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        /* ============================================
           Footer / Actions
           ============================================ */
        .footer {
            padding: var(--space-md) var(--space-lg);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: var(--space-sm);
        }

        .button {
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            border: none;
            font-family: var(--font-family);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }

        .button.primary {
            background: linear-gradient(135deg, var(--neon-cyan), #00b8cc);
            color: var(--bg-base);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .button.primary:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: translateY(-1px);
        }

        .button.primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .button.secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border-default);
        }

        .button.secondary:hover:not(:disabled) {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button.submitted {
            background: var(--bg-elevated);
            color: var(--text-muted);
            pointer-events: none;
        }

        .button.submitted::before {
            content: '✓';
            margin-right: var(--space-xs);
        }

        .hidden {
            display: none !important;
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile {
            padding: 0;
        }

        body.mobile .final-defense-container {
            max-width: 100%;
            border-radius: 0;
            border-left: none;
            border-right: none;
            min-height: 100%;
        }

        body.mobile .content {
            flex: 1;
        }

        body.mobile .defense-input,
        body.mobile .defense-message {
            min-height: 150px;
        }

        /* ============================================
           Scrollbar
           ============================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="final-defense-container">
        <div class="header">
            <div class="header-icon">⚖️</div>
            <h1>최후 변론</h1>
            <p>가장 많은 표를 받은 플레이어의 최후 변론 시간입니다</p>
        </div>

        <div class="content">
            <div class="player-info">
                <div class="player-avatar" id="playerAvatar">?</div>
                <div class="player-details">
                    <div class="player-name" id="playerName">플레이어 이름</div>
                    <div class="player-status">최후 변론 중</div>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-label">남은 시간</div>
                <div class="timer" id="timer">00:20</div>
            </div>

            <!-- Defendant View -->
            <div class="defense-area defendant-view" id="defendantView">
                <div class="defense-title">당신의 최후 변론을 입력하세요</div>
                <textarea class="defense-input" id="defenseInput" placeholder="자신의 무죄를 주장하세요..."></textarea>
                <button class="button primary" id="submitDefenseBtn">변론 제출</button>
            </div>

            <!-- Spectator View -->
            <div class="defense-area spectator-view" id="spectatorView">
                <div class="defense-title">최후 변론 내용</div>
                <div class="defense-message empty" id="defenseMessage">
                    아직 변론이 제출되지 않았습니다.
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="button secondary" id="closeBtn">닫기</button>
        </div>
    </div>

    <script>
        // Global variables
        let timeLeft = 20;
        let timerInterval;
        let isDefendant = false;
        let defenseSubmitted = false;
        let defendantId = null;
        let myPlayerId = null;
        let _isMobile = false;
        let _isTablet = false;

        // DOM elements
        const timerElement = document.getElementById('timer');
        const playerNameElement = document.getElementById('playerName');
        const playerAvatarElement = document.getElementById('playerAvatar');
        const defendantView = document.getElementById('defendantView');
        const spectatorView = document.getElementById('spectatorView');
        const defenseInput = document.getElementById('defenseInput');
        const defenseMessage = document.getElementById('defenseMessage');
        const submitDefenseBtn = document.getElementById('submitDefenseBtn');
        const closeBtn = document.getElementById('closeBtn');

        // Event listeners
        submitDefenseBtn.addEventListener('click', submitDefense);
        closeBtn.addEventListener('click', closeWidget);

        function initialize(data) {
            // Set player info
            defendantId = data.defendantId;
            myPlayerId = data.myPlayerId;
            isDefendant = defendantId === myPlayerId;
            defenseSubmitted = false;

            // Set player name and avatar
            playerNameElement.textContent = data.defendantName;
            playerAvatarElement.textContent = data.defendantName.charAt(0).toUpperCase();

            // Set timer
            timeLeft = data.timeLimit || 20;
            updateTimerDisplay();
            startTimer();

            // Reset input
            defenseInput.value = '';
            submitDefenseBtn.disabled = false;
            submitDefenseBtn.classList.remove('submitted');
            submitDefenseBtn.textContent = '변론 제출';

            // Set view
            if (isDefendant) {
                defendantView.classList.add('active');
                spectatorView.classList.remove('active');
            } else {
                defendantView.classList.remove('active');
                spectatorView.classList.add('active');
            }

            // Reset defense message
            defenseMessage.textContent = '아직 변론이 제출되지 않았습니다.';
            defenseMessage.classList.add('empty');

            revealWidget();
        }

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                // Add warning/critical classes
                if (timeLeft <= 5) {
                    timerElement.classList.add('critical');
                    timerElement.classList.remove('warning');
                } else if (timeLeft <= 10) {
                    timerElement.classList.add('warning');
                    timerElement.classList.remove('critical');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);

                    // Auto-submit when time is up
                    if (isDefendant && !defenseSubmitted) {
                        submitDefense();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function submitDefense() {
            if (defenseSubmitted) return;

            const defenseText = defenseInput.value.trim();
            defenseSubmitted = true;
            submitDefenseBtn.disabled = true;
            submitDefenseBtn.classList.add('submitted');
            submitDefenseBtn.textContent = '제출 완료';

            window.parent.postMessage({
                type: 'submitDefense',
                defense: defenseText
            }, '*');
        }

        function updateDefenseMessage(message) {
            if (message && message.trim()) {
                defenseMessage.textContent = message;
                defenseMessage.classList.remove('empty');
            } else {
                defenseMessage.textContent = '변론이 제출되지 않았습니다.';
                defenseMessage.classList.add('empty');
            }
        }

        function closeWidget() {
            hideWidget();
        }

        function hideWidget() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function revealWidget() {
            if (_isMobile) {
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                window.parent.postMessage({
                    type: "WidgetRearrange",
                    anchor: "middle",
                    width: "520px",
                    height: "500px",
                }, "*");
            }
        }

        // Message handler
        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;
                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                initialize(data);
            } else if (data.type === 'updateDefense') {
                updateDefenseMessage(data.defense);
            } else if (data.type === 'hideWidget' || data.type === 'hide') {
                hideWidget();
            } else if (data.type === 'showWidget' || data.type === 'reveal') {
                revealWidget();
            } else if (data.type === 'focusInput') {
                defenseInput.focus();
            }
        });

        // ESC key handler
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.parent.focus();
            }
        });
    </script>
</body>
</html>
