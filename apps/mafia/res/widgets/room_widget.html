<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const fontPath = document.URL.includes('https://zep.us')
            ? "https://cdn-static.zep.us/static/zep-script/css/typography.css"
            : "https://cdn-static-stage.zep.us/static/zep-script/css/typography.css";
        document.head.appendChild(Object.assign(document.createElement("link"), {
            rel: "stylesheet",
            type: "text/css",
            href: fontPath
        }));
    </script>
    <style>
        /* ============================================
           Design System Variables
           ============================================ */
        :root {
            --sat: env(safe-area-inset-top);
            --sar: env(safe-area-inset-right);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);

            /* Neon Colors */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b026ff;

            /* Background */
            --bg-base: #0a0a0f;
            --bg-surface: #12121a;
            --bg-elevated: #1a1a25;

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;

            /* Border */
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-default: rgba(255, 255, 255, 0.1);

            /* Semantic */
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;

            /* Shadow & Glow */
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-pink: 0 0 20px rgba(255, 45, 149, 0.5);

            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 12px;
            --space-lg: 16px;
            --space-xl: 24px;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            /* Typography */
            --font-family: 'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;

            /* Transition */
            --transition-fast: 0.15s ease;
        }

        /* ============================================
           Base Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Blur overlay for Center Card mode */
        .blur-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1;
            opacity: 1;
            transition: opacity 0.25s ease;
            cursor: pointer;
        }

        body.compact .blur-overlay {
            opacity: 0;
            pointer-events: none;
        }

        body.mobile {
            background: var(--bg-base);
        }

        body.mobile .blur-overlay {
            display: none;
        }

        /* ============================================
           Main Container
           ============================================ */
        #room-widget-container {
            display: flex;
            flex-direction: column;
            width: 70%;
            max-width: 900px;
            height: 80%;
            max-height: 700px;
            background: var(--bg-base);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 240, 255, 0.1);
            z-index: 2;
            position: relative;
        }

        body.mobile #room-widget-container {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            border-radius: 0;
            border: none;
        }

        body.compact #room-widget-container {
            display: none !important;
        }

        /* ========== Compact Mode Button ========== */
        .compact-button {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--neon-pink) 0%, #cc0055 100%);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 45, 149, 0.5), 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            animation: compactPulse 2s ease-in-out infinite;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .compact-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 45, 149, 0.6), 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .compact-button .badge {
            font-size: 10px;
            font-weight: 700;
        }

        @keyframes compactPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 45, 149, 0.4), 0 4px 16px rgba(0, 0, 0, 0.4); }
            50% { box-shadow: 0 0 30px rgba(255, 45, 149, 0.6), 0 4px 16px rgba(0, 0, 0, 0.4); }
        }

        body.compact .compact-button {
            display: flex;
        }

        /* ============================================
           Header
           ============================================ */
        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) var(--space-lg);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .room-details {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .room-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: var(--glow-cyan);
        }

        .room-info {
            display: flex;
            gap: var(--space-md);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-controls {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
        }

        /* Header action buttons */
        .header-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-elevated);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .header-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .header-btn.close:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        body.mobile .header-btn.minimize {
            display: none;
        }

        /* ============================================
           Buttons
           ============================================ */
        .button {
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-md);
            border: none;
            font-family: var(--font-family);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .button.primary {
            background: linear-gradient(135deg, var(--neon-cyan), #00b8cc);
            color: var(--bg-base);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .button.primary:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: translateY(-1px);
        }

        .button.secondary {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border-default);
        }

        .button.secondary:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .button.danger {
            background: linear-gradient(135deg, var(--danger), #cc0033);
            color: white;
        }

        .button.danger:hover {
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ready-btn {
            background: linear-gradient(135deg, var(--success), #00cc6a);
            color: var(--bg-base);
        }

        .ready-btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .not-ready-btn {
            background: linear-gradient(135deg, var(--danger), #cc0033);
            color: white;
        }

        /* ============================================
           Main Content
           ============================================ */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Players Container */
        .players-container {
            flex: 1;
            padding: var(--space-lg);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Settings Section */
        .settings-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-md);
        }

        .game-mode-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
        }

        .mode-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--neon-cyan);
        }

        .mode-description {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .mode-jobs {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-top: var(--space-sm);
        }

        .job-tag {
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 500;
        }

        .job-tag.mafia {
            background: rgba(255, 51, 102, 0.2);
            color: #ff6b8a;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .job-tag.citizen {
            background: rgba(0, 240, 255, 0.15);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .job-tag.neutral {
            background: rgba(255, 170, 0, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        /* Players Grid */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-md);
        }

        .player-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
            transition: all var(--transition-fast);
        }

        .player-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--bg-elevated);
            border: 2px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xs);
        }

        .player-level {
            font-size: 10px;
            color: var(--text-muted);
        }

        .player-status {
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
        }

        .player-status.host {
            background: rgba(255, 45, 149, 0.2);
            color: var(--neon-pink);
            border: 1px solid rgba(255, 45, 149, 0.3);
        }

        .player-status.ready {
            background: rgba(0, 255, 136, 0.15);
            color: var(--success);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .player-status.not-ready {
            background: rgba(255, 51, 102, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .player-actions {
            margin-top: var(--space-xs);
        }

        .kick-btn {
            padding: var(--space-xs) var(--space-sm);
            background: transparent;
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: var(--radius-sm);
            color: var(--danger);
            font-size: 10px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .kick-btn:hover {
            background: rgba(255, 51, 102, 0.2);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }

        .action-buttons .button {
            flex: 1;
            padding: var(--space-md);
            font-size: 14px;
        }

        /* ============================================
           Chat Sidebar
           ============================================ */
        .chat-sidebar {
            width: 260px;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-default);
        }

        .chat-header {
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .chat-messages {
            flex: 1;
            padding: var(--space-md);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .message {
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            font-size: 12px;
            line-height: 1.4;
            max-width: 90%;
            word-break: break-word;
            animation: messageAppear 0.2s ease-out;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system {
            background: var(--bg-elevated);
            color: var(--text-muted);
            text-align: center;
            align-self: center;
            font-size: 11px;
        }

        .message.mine {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0, 240, 255, 0.2);
            align-self: flex-end;
            color: var(--text-primary);
        }

        .message.others {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            align-self: flex-start;
        }

        .sender-name {
            font-size: 10px;
            font-weight: 600;
            color: var(--neon-cyan);
            margin-bottom: var(--space-xs);
        }

        /* Chat Input */
        .chat-input {
            display: flex;
            gap: var(--space-sm);
            padding: var(--space-md);
            border-top: 1px solid var(--border-subtle);
        }

        .chat-input input {
            flex: 1;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-base);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 13px;
        }

        .chat-input input::placeholder {
            color: var(--text-muted);
        }

        .chat-input input:focus {
            outline: none;
            border-color: var(--neon-cyan);
        }

        .chat-input button {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--neon-cyan), #00b8cc);
            border: none;
            border-radius: var(--radius-full);
            color: var(--bg-base);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .chat-input button:hover {
            box-shadow: var(--glow-cyan);
        }

        /* ============================================
           Scrollbar
           ============================================ */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 240, 255, 0.3);
        }

        /* ============================================
           Mobile Styles
           ============================================ */
        body.mobile #room-widget-container {
            display: flex;
        }

        body.mobile .room-header {
            padding: var(--space-sm) var(--space-md);
        }

        body.mobile .room-title {
            font-size: 16px;
        }

        body.mobile .main-content {
            flex-direction: column;
        }

        body.mobile .players-container {
            padding: var(--space-md);
        }

        body.mobile .chat-sidebar {
            width: 100%;
            height: 200px;
            border-left: none;
            border-top: 1px solid var(--border-default);
        }

        body.mobile .players-grid {
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: var(--space-sm);
        }

        body.mobile .player-card {
            padding: var(--space-sm);
        }

        body.mobile .player-avatar {
            width: 36px;
            height: 36px;
            font-size: 14px;
        }

        body.mobile .player-name {
            font-size: 11px;
        }

        @media (orientation: landscape) {
            body.mobile .main-content {
                flex-direction: row;
            }

            body.mobile .players-container {
                width: 65%;
            }

            body.mobile .chat-sidebar {
                width: 35%;
                height: auto;
                border-top: none;
                border-left: 1px solid var(--border-default);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Blur Overlay -->
    <div class="blur-overlay"></div>

    <!-- Compact Mode Button -->
    <button id="compactButton" class="compact-button">
        👥
        <span id="playerCountBadge" class="badge">0/0</span>
    </button>

    <div id="room-widget-container">
        <div class="room-header">
            <div class="room-details">
                <h1 class="room-title" id="roomTitle">방 제목</h1>
                <div class="room-info">
                    <span id="roomPlayers">참가자: 0/0</span>
                    <span id="roomMode">모드: 클래식</span>
                </div>
            </div>
            <div class="header-controls">
                <button class="button secondary" id="leaveRoomBtn">나가기</button>
                <button id="minimizeBtn" class="header-btn minimize" title="축소">−</button>
            </div>
        </div>

        <div class="main-content">
            <div class="players-container">
                <div class="settings-section">
                    <div class="section-title">게임 설정</div>
                    <div id="gameModeInfo" class="game-mode-info"></div>
                </div>

                <div>
                    <div class="section-title">참가자 목록</div>
                    <div id="playersGrid" class="players-grid"></div>
                </div>

                <div class="action-buttons" id="actionButtonsContainer"></div>
            </div>

            <div class="chat-sidebar">
                <div class="chat-header">채팅</div>
                <div id="chatMessages" class="chat-messages">
                    <div class="message system">채팅방에 입장했습니다.</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="메시지 입력...">
                    <button id="sendBtn">></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let room = null;
        let players = [];
        let currentUser = null;
        let isHost = false;
        let isReady = false;
        let gameMode = null;
        let gameModeDetails = null;
        let _isMobile = false;
        let _isTablet = false;
        let isCompact = true; // Start in compact mode

        const roomContainer = document.getElementById('room-widget-container');
        const roomTitle = document.getElementById('roomTitle');
        const roomPlayers = document.getElementById('roomPlayers');
        const roomMode = document.getElementById('roomMode');
        const playersGrid = document.getElementById('playersGrid');
        const actionButtonsContainer = document.getElementById('actionButtonsContainer');
        const leaveRoomBtn = document.getElementById('leaveRoomBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const gameModeInfo = document.getElementById('gameModeInfo');
        const compactButton = document.getElementById('compactButton');
        const playerCountBadge = document.getElementById('playerCountBadge');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const blurOverlay = document.querySelector('.blur-overlay');

        leaveRoomBtn.addEventListener('click', leaveRoom);
        sendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });
        compactButton.addEventListener('click', expandFromCompact);
        minimizeBtn.addEventListener('click', enterCompactMode);
        blurOverlay.addEventListener('click', enterCompactMode);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.parent.focus();
        });

        function initializeRoom() {
            window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            window.parent.postMessage({ type: 'requestGameModeDetails' }, "*");
        }

        function updateRoomInfo(roomData) {
            room = roomData;
            players = roomData.players;
            currentUser = roomData.currentUser;
            isHost = currentUser.id === roomData.host.id;

            roomTitle.textContent = room.title;
            roomPlayers.textContent = `참가자: ${players.length}/${room.maxPlayers}`;
            roomMode.textContent = `모드: ${room.gameMode}`;
            updatePlayerCountBadge();

            renderPlayers();
            renderActionButtons();
        }

        function updatePlayerCountBadge() {
            if (room) {
                const readyCount = players.filter(p => p.isReady || p.id === room.host.id).length;
                playerCountBadge.textContent = `${readyCount}/${players.length}`;
            }
        }

        function updateGameModeInfo(modeData) {
            gameModeDetails = modeData;
            gameModeInfo.innerHTML = `
                <div class="mode-name">${modeData.name}</div>
                <div class="mode-description">${modeData.description}</div>
                <div class="mode-jobs">${renderJobTags(modeData.jobs)}</div>
            `;
        }

        function renderJobTags(jobs) {
            return jobs.map(job => {
                const teamClass = job.team.toLowerCase();
                return `<div class="job-tag ${teamClass}">${job.name}</div>`;
            }).join('');
        }

        function renderPlayers() {
            playersGrid.innerHTML = '';

            players.forEach(player => {
                const playerCard = document.createElement('div');
                playerCard.className = 'player-card';

                const initial = player.name.charAt(0).toUpperCase();
                const isPlayerHost = player.id === room.host.id;
                const isPlayerReady = player.isReady;

                let statusClass = '';
                let statusText = '';

                if (isPlayerHost) {
                    statusClass = 'host';
                    statusText = '방장';
                } else if (isPlayerReady) {
                    statusClass = 'ready';
                    statusText = '준비완료';
                } else {
                    statusClass = 'not-ready';
                    statusText = '미준비';
                }

                playerCard.innerHTML = `
                    <div class="player-avatar">${initial}</div>
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        <div class="player-level">Lv. ${player.level || 1}</div>
                        <div class="player-status ${statusClass}">${statusText}</div>
                    </div>
                `;

                if (isHost && !isPlayerHost) {
                    const playerActions = document.createElement('div');
                    playerActions.className = 'player-actions';

                    const kickBtn = document.createElement('button');
                    kickBtn.className = 'kick-btn';
                    kickBtn.textContent = '강퇴';
                    kickBtn.addEventListener('click', () => kickPlayer(player.id));

                    playerActions.appendChild(kickBtn);
                    playerCard.appendChild(playerActions);
                }

                playersGrid.appendChild(playerCard);
            });
        }

        function renderActionButtons() {
            actionButtonsContainer.innerHTML = '';

            if (isHost) {
                const startBtn = document.createElement('button');
                startBtn.className = 'button primary';
                startBtn.textContent = '게임 시작';
                startBtn.addEventListener('click', startGame);

                const canStart = players.length >= 4 && players.every(player =>
                    player.id === room.host.id || player.isReady
                );

                if (!canStart) {
                    startBtn.disabled = true;
                }

                actionButtonsContainer.appendChild(startBtn);
            } else {
                const readyBtn = document.createElement('button');

                if (isReady) {
                    readyBtn.className = 'button not-ready-btn';
                    readyBtn.textContent = '준비 취소';
                    readyBtn.addEventListener('click', cancelReady);
                } else {
                    readyBtn.className = 'button ready-btn';
                    readyBtn.textContent = '준비 완료';
                    readyBtn.addEventListener('click', setReady);
                }

                actionButtonsContainer.appendChild(readyBtn);
            }
        }

        function setReady() {
            isReady = true;
            window.parent.postMessage({ type: 'setReady' }, "*");
        }

        function cancelReady() {
            isReady = false;
            window.parent.postMessage({ type: 'cancelReady' }, "*");
        }

        function startGame() {
            window.parent.postMessage({ type: 'startGame' }, "*");
        }

        function leaveRoom() {
            window.parent.postMessage({ type: 'leaveRoom' }, "*");
        }

        function kickPlayer(playerId) {
            if (!isHost) return;
            window.parent.postMessage({ type: 'kickPlayer', playerId: playerId }, "*");
        }

        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            window.parent.postMessage({ type: 'chatMessage', content: message }, "*");
            chatInput.value = '';
        }

        function addChatMessage(message) {
            const msgElement = document.createElement('div');

            if (message.type === 'system') {
                msgElement.className = 'message system';
                msgElement.textContent = message.content;
            } else if (message.senderId === currentUser.id) {
                msgElement.className = 'message mine';
                msgElement.textContent = message.content;
            } else {
                msgElement.className = 'message others';
                msgElement.innerHTML = `<div class="sender-name">${message.senderName}</div>${message.content}`;
            }

            chatMessages.appendChild(msgElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function revealWidget() {
            if (_isMobile) {
                // Mobile: full screen
                document.body.classList.remove('compact');
                roomContainer.style.display = 'flex';
                window.parent.postMessage({
                    type: 'WidgetRearrange',
                    anchor: 'middle',
                    height: '100%',
                    width: '100%',
                }, '*');
            } else {
                // Desktop: Center Card mode
                if (isCompact) {
                    applyCompactMode();
                } else {
                    applyExpandedMode();
                }
            }
        }

        function applyExpandedMode() {
            isCompact = false;
            document.body.classList.remove('compact');
            roomContainer.style.display = 'flex';
            window.parent.postMessage({
                type: "WidgetRearrange",
                anchor: "middle",
                width: "100%",
                height: "100%",
            }, "*");
        }

        function applyCompactMode() {
            isCompact = true;
            document.body.classList.add('compact');
            roomContainer.style.display = 'none';
            updatePlayerCountBadge();
            window.parent.postMessage({
                type: "WidgetRearrange",
                anchor: "topright",
                width: "80px",
                height: "80px",
            }, "*");
        }

        function enterCompactMode() {
            if (_isMobile) return;
            applyCompactMode();
        }

        function expandFromCompact() {
            applyExpandedMode();
            window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
        }

        function hideWidget() {
            isCompact = false;
            document.body.classList.remove('compact');
            window.parent.postMessage({
                type: "WidgetRearrange",
                width: "0px",
                height: "0px",
            }, "*");
            window.parent.focus();
        }

        function adjustMobileUI() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const mainContent = document.querySelector('.main-content');
            const playersContainer = document.querySelector('.players-container');
            const chatSidebar = document.querySelector('.chat-sidebar');

            if (isLandscape) {
                mainContent.style.flexDirection = 'row';
                playersContainer.style.width = '65%';
                chatSidebar.style.width = '35%';
                chatSidebar.style.height = 'auto';
                chatSidebar.style.borderTop = 'none';
                chatSidebar.style.borderLeft = '1px solid var(--border-default)';
            } else {
                mainContent.style.flexDirection = 'column';
                playersContainer.style.width = '100%';
                chatSidebar.style.width = '100%';
                chatSidebar.style.height = '200px';
                chatSidebar.style.borderTop = '1px solid var(--border-default)';
                chatSidebar.style.borderLeft = 'none';
            }
        }

        window.addEventListener('message', function(e) {
            const data = e.data;

            if (data.type === "setWidget") {
                _isMobile = data.isMobile;
                _isTablet = data.isTablet;
                if (data.isMobile && !data.isTablet) {
                    document.body.classList.add('mobile');
                    adjustMobileUI();
                } else {
                    document.body.classList.remove('mobile');
                }
                hideWidget();
            } else if (data.type === 'init') {
                _isMobile = data.isMobile || false;
                _isTablet = data.isTablet || false;
                if (_isMobile && !_isTablet) {
                    document.body.classList.add('mobile');
                    isCompact = false; // Mobile always starts expanded
                } else {
                    document.body.classList.remove('mobile');
                    isCompact = true; // Desktop starts in compact mode
                }
                document.body.classList.remove("hidden");
                revealWidget();
            } else if (data.type === 'roomInfo') {
                updateRoomInfo(data.roomData);
                if (data.roomData.state === 'IN_PROGRESS') {
                    hideWidget();
                } else {
                    revealWidget();
                }
            } else if (data.type === 'gameModeDetails') {
                updateGameModeInfo(data.modeData);
            } else if (data.type === 'playerJoined') {
                addChatMessage({ type: 'system', content: `${data.playerName}님이 입장했습니다.` });
                window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            } else if (data.type === 'playerLeft') {
                addChatMessage({ type: 'system', content: `${data.playerName}님이 퇴장했습니다.` });
                window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            } else if (data.type === 'playerKicked') {
                addChatMessage({ type: 'system', content: `${data.playerName}님이 강퇴되었습니다.` });
                window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            } else if (data.type === 'readyStatusChanged') {
                window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            } else if (data.type === 'hostChanged') {
                addChatMessage({ type: 'system', content: `${data.newHostName}님이 새로운 방장이 되었습니다.` });
                window.parent.postMessage({ type: 'requestRoomInfo' }, "*");
            } else if (data.type === 'gameStarting') {
                addChatMessage({ type: 'system', content: '게임이 곧 시작됩니다...' });
                hideWidget();
            } else if (data.type === 'gameEnded') {
                addChatMessage({ type: 'system', content: '게임이 종료되었습니다.' });
                revealWidget();
            } else if (data.type === 'chatMessage') {
                addChatMessage({
                    type: 'normal',
                    senderId: data.senderId,
                    senderName: data.senderName,
                    content: data.content
                });
            } else if (data.type === 'error') {
                alert(data.message);
            } else if (data.type === 'hideWidget' || data.type === 'hide') {
                hideWidget();
            } else if (data.type === 'showWidget' || data.type === 'reveal') {
                chatMessages.innerHTML = '<div class="message system">채팅방에 입장했습니다.</div>';
                if (!_isMobile) {
                    isCompact = true; // Desktop starts in compact mode
                }
                revealWidget();
            } else if (data.type === 'focusInput') {
                chatInput.focus();
            }
        });

        window.addEventListener('resize', function() {
            if (_isMobile) adjustMobileUI();
        });

        window.addEventListener('unload', function() {
            window.parent.focus();
        });

        initializeRoom();
    </script>
</body>
</html>
